  <!-- Dynamic Absolute URL Resolver for Social Platforms & Crawlers -->
  <script>
    (function () {
      try {
        var origin = window.location.origin;
        var pathname = window.location.pathname.replace(/\/+$/, '') + '/';
        var fullUrl = origin + pathname;

        // Update Canonical
        var canLink = document.getElementById('canonical-url');
        if (canLink) canLink.href = fullUrl;

        // Resolve absolute image URL for OG and Twitter cards
        var previewImgPath = (pathname.endsWith('/') ? pathname : pathname + '/') + 'assets/images/og-preview.png';
        var absolutePreviewUrl = origin + previewImgPath.replace(/\/+/g, '/');

        var ogUrl = document.getElementById('og-url');
        if (ogUrl) ogUrl.setAttribute('content', fullUrl);

        var ogImg = document.getElementById('og-image');
        if (ogImg) ogImg.setAttribute('content', absolutePreviewUrl);

        var ogImgSec = document.getElementById('og-image-secure');
        if (ogImgSec) ogImgSec.setAttribute('content', absolutePreviewUrl);

        var twImg = document.getElementById('twitter-image');
        if (twImg) twImg.setAttribute('content', absolutePreviewUrl);

        // Update Schema LD+JSON URLs dynamically
        var schemaEl = document.getElementById('schema-ld-json');
        if (schemaEl) {
          var data = JSON.parse(schemaEl.textContent);
          if (data && data['@graph']) {
            data['@graph'].forEach(function (item) {
              if (item['@type'] === 'WebSite') item.url = fullUrl;
              if (item['@id']) item['@id'] = item['@id'].replace('https://mustaquim-ms.github.io/', fullUrl);
            });
            schemaEl.textContent = JSON.stringify(data);
          }
        }
      } catch (e) {
        // Fallback gracefully without breaking page render
        console.debug('SEO dynamic tag resolver note:', e);
      }
    })();
  </script>
